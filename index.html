<style>
/* Layout: full-bleed 3D stage; title plaque top-left, reference photo top-right, view switcher docked at bottom */
:root{
  --paper:#fbf8f2; --ink:#2a2723; --muted:#6c665c;
  --tile:#6b4a36; --granite:#8d8a83; --line:#d9d2c5;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#cfe0ef;overflow:hidden}
body{font-family:var(--sans);color:var(--ink)}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.plaque{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);padding:12px 16px 12px 14px;border-radius:4px;max-width:min(300px,calc(100vw - 32px - 132px))}
.plaque h1{font-family:var(--serif);font-weight:900;font-size:26px;letter-spacing:.18em;margin:0;line-height:1.15;text-wrap:balance}
.plaque p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.plaque .scale{font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.06em;color:var(--tile);margin-top:6px}
.ref{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:200px;background:var(--paper);border:1px solid var(--line);padding:5px;border-radius:4px;cursor:zoom-in;transition:width .3s ease}
.ref.big{width:min(560px,calc(100vw - 32px));cursor:zoom-out}
.ref img{display:block;width:100%;border-radius:2px}
.ref span{display:block;font-size:11px;color:var(--muted);padding:5px 2px 1px;letter-spacing:.04em}
.ref[hidden]{display:none!important}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;width:calc(100vw - 32px);max-width:720px}
.views{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);padding:6px;border-radius:6px}
.views button{font:500 14px var(--sans);color:var(--ink);background:transparent;border:1px solid transparent;padding:8px 14px;border-radius:4px;cursor:pointer;letter-spacing:.06em}
.views button:hover{background:#efe9de}
.views button[aria-pressed="true"]{background:var(--tile);color:#fff}
.views button:focus-visible{outline:2px solid var(--tile);outline-offset:2px}
.views .sep{width:1px;background:var(--line);margin:4px 2px}
.hint{font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);letter-spacing:.05em;text-align:center}
@media (max-width:560px){
  .ref{width:108px}
  .plaque{max-width:calc(100vw - 32px - 124px);padding:10px 12px}
  .plaque h1{font-size:21px}
  .plaque p{font-size:11.5px}
  .views button{padding:7px 10px;font-size:13px}
}
/* ---- 老靈魂 listening tour ---- */
.views .soul{font-family:var(--serif);font-weight:700;background:#2b2622;color:#f3ead9;letter-spacing:.14em}
.views .soul:hover{background:#3b332c}
body.touring .plaque,body.touring .ref,body.touring .dock{display:none!important}
#tour{position:fixed;inset:0;pointer-events:none;color:#f6efe3}
#tour[hidden]{display:none!important}
#tour::before,#tour::after{content:"";position:absolute;left:0;right:0;height:22%;pointer-events:none}
#tour::before{top:0;background:linear-gradient(rgba(10,9,8,.35),transparent)}
#tour::after{bottom:0;height:34%;background:linear-gradient(transparent,rgba(10,9,8,.6))}
.t-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;transition:opacity 1.6s ease;z-index:1}
.t-title h2{font-family:var(--serif);font-weight:900;font-size:clamp(40px,9vw,72px);letter-spacing:.42em;margin:0 0 0 .42em;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.t-title p{margin:0;font-family:var(--serif);font-size:14px;letter-spacing:.3em;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.t-title small{font-size:11.5px;letter-spacing:.08em;opacity:.75;margin-top:18px}
.t-text{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(24em,calc(100vw - 28px));z-index:1;
  font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.9vw,32px);line-height:1.6;letter-spacing:.06em;text-align:center;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,.5);transition:opacity 1.4s ease}
.t-text .no{display:block;font-size:13px;letter-spacing:.5em;opacity:.7;margin-bottom:6px;font-family:var(--sans)}
.t-text span{display:none}
.t-text span.prev{display:block;font-size:.62em;opacity:.5;margin-bottom:.3em}
.t-text span.cur{display:block;animation:tIn 1.6s ease both}
@keyframes tIn{from{opacity:0;transform:translateY(.2em)}to{opacity:1;transform:none}}
.t-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));pointer-events:auto;z-index:2;
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;background:rgba(22,19,17,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:5px;width:max-content;max-width:calc(100vw - 32px)}
.t-bar button{font:500 13px var(--sans);color:#efe6d6;background:transparent;border:0;border-radius:4px;padding:8px 11px;cursor:pointer;letter-spacing:.1em}
.t-bar button:hover{background:rgba(255,255,255,.1)}
.t-bar button[aria-current="true"]{background:rgba(243,234,217,.92);color:#2b2622}
.t-bar button:focus-visible{outline:2px solid #f3ead9;outline-offset:1px}
.t-bar .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.18);margin:4px 3px}
.t-prog{position:absolute;left:5px;right:5px;top:-1px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.t-prog i{display:block;height:100%;width:0;background:#e9cf9c}
.t-end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:auto;z-index:3;transition:opacity 1.5s}
.t-end p{font-family:var(--serif);letter-spacing:.4em;font-size:15px;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.t-end div{display:flex;gap:10px}
.t-end button{font:500 14px var(--sans);letter-spacing:.12em;padding:10px 18px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:rgba(22,19,17,.5);color:#f3ead9;cursor:pointer}
.t-end button:first-child{background:#f3ead9;color:#2b2622;border-color:#f3ead9}
.t-end[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.t-text span.cur{animation:none}.t-title,.t-text{transition:none}}
</style>
</head>
<body>
<canvas id="stage" aria-label="日式圖書館 3D 模型，可拖曳旋轉"></canvas>
<div class="plaque">
  <h1>圖書館</h1>
  <p>日式校舍建築 · 屋瓦寄棟頂、洗石子拱廊、木格窗</p>
  <div class="scale">約 34 m × 11 m · 依四張實景照片復原</div>
</div>
<figure class="ref" id="ref" title="點一下放大／縮小">
  <img id="refImg" alt="實景照片">
  <span id="refCap"></span>
</figure>
<div class="dock">
  <div class="views" role="group" aria-label="視角">
    <button id="v-front" data-v="front">正面</button>
    <button id="v-walk" data-v="walk">步道</button>
    <button id="v-corr" data-v="corr">走廊</button>
    <button id="v-side" data-v="side">側面</button>
    <button id="v-back" data-v="back">背面</button>
    <button id="v-corner" data-v="corner">背面轉角</button>
    <button id="v-air" data-v="air">鳥瞰</button>
    <span class="sep"></span>
    <button id="v-spin" aria-pressed="false">自動旋轉</button>
    <span class="sep"></span>
    <button id="v-soul" class="soul">♪ 老靈魂</button>
  </div>
  <div class="hint">拖曳旋轉 · 滾輪／雙指縮放 · 右鍵／雙指平移</div>
</div>
<div id="tour" hidden aria-live="polite">
  <div class="t-title" id="tTitle"><h2>老靈魂</h2><p>文 · Young　　樂 · 即時生成</p><small>請開啟聲音（iPhone 請關閉靜音模式）</small></div>
  <div class="t-text" id="tText"></div>
  <div class="t-end" id="tEnd" hidden><p>靜默，又何所求</p><div><button id="tAgain">再聽一次</button><button id="tFree">自由瀏覽</button></div></div>
  <div class="t-bar" id="tBar">
    <div class="t-prog"><i id="tProg"></i></div>
    <button data-ch="1">中軸</button><button data-ch="2">老榕</button><button data-ch="3">記憶</button><button data-ch="4">仰望</button>
    <span class="sep"></span>
    <button id="tPause">暫停</button><button id="tExit">離開</button>
  </div>
</div>

function featherTex(hue,light,droop){return alphaTex(512,128,(g,W,H)=>{g.strokeStyle=`hsl(${hue},30%,${light-10}%)`;g.lineWidth=3;g.beginPath();g.moveTo(0,H/2);g.lineTo(W,H/2);g.stroke();

    for(const s of [-1,1]){g.strokeStyle=`hsl(${hue+rr(-6,6)},${rr(30,45)}%,${light+rr(-8,8)}%)`;g.lineWidth=2.2;g.beginPath();g.moveTo(x,H/2);g.quadraticCurveTo(x+len*.4,H/2+s*len*.6,x+len*.75,H/2+s*len*(droop?1:.95));g.stroke();}}});}
const palmFrondTex=featherTex(85,38,true), araucariaTex=featherTex(120,22,false);
const barkTex=tex(64,256,(g,W,H)=>{g.fillStyle='#5b5046';g.fillRect(0,0,W,H);for(let i=0;i<70;i++){g.strokeStyle=`rgba(${rr(30,120)},${rr(25,100)},${rr(20,85)},.6)`;g.lineWidth=rr(1,3);const x=rr(0,W);g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+rr(-6,6),H*.3,x+rr(-6,6),H*.7,x+rr(-4,4),H);g.stroke();}},2,1);
const BARK={banyan:new THREE.MeshStandardMaterial({map:barkTex,color:0x9a9488,roughness:1}),
  casu:new THREE.MeshStandardMaterial({map:barkTex,color:0x8a7a6a,roughness:1}),
  palm:new THREE.MeshStandardMaterial({color:0xb9b5ab,roughness:.9}),
  root:new THREE.MeshStandardMaterial({color:0x3a3029,roughness:1})};

// leaf material: normals point out of the canopy so a cloud of cards shades like a soft volume
function foliageMat(map,center){const m=new THREE.MeshStandardMaterial({map,alphaTest:.45,side:THREE.DoubleSide,roughness:.85,metalness:0});
  m.onBeforeCompile=sh=>{sh.uniforms.uCenter={value:center};
    sh.vertexShader='uniform vec3 uCenter;\n'+sh.vertexShader.replace('#include <defaultnormal_vertex>','vec3 transformedNormal = normalMatrix * normalize(instanceMatrix[3].xyz - uCenter + vec3(0.0,0.6,0.0));');
    sh.fragmentShader=sh.fragmentShader.replace('#include <normal_fragment_begin>','float faceDirection = 1.0; vec3 normal = normalize(vNormal); vec3 geometryNormal = normal;');};
  m.customProgramCacheKey=()=>'foliage';return m;}
function depthFor(map){return new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map,alphaTest:.45,side:THREE.DoubleSide});}
// a canopy = many leaf cards scattered through an ellipsoid shell
function canopy({x,y,z,rx,ry,rz,n,size,map,hue=[0,0],light=[.75,1.1],shell=.45,droop=0,shadow=true}){
  const geo=new THREE.PlaneGeometry(1,1);if(droop)geo.translate(0,-.5,0);
  const c=new THREE.Vector3(x,y,z),mesh=new THREE.InstancedMesh(geo,foliageMat(map,c),n);
  const o=new THREE.Object3D(),col=new THREE.Color();
  for(let i=0;i<n;i++){let dx,dy,dz;do{dx=rr(-1,1);dy=rr(-1,1);dz=rr(-1,1);}while(dx*dx+dy*dy+dz*dz>1);
    const k=Math.pow(rr(0,1),shell)/Math.max(.001,Math.hypot(dx,dy,dz));const d=Math.min(1,Math.hypot(dx,dy,dz)*k);const L=Math.hypot(dx,dy,dz)||1;
    dx=dx/L*d;dy=dy/L*d;dz=dz/L*d;
    o.position.set(x+dx*rx,y+dy*ry,z+dz*rz);
    if(droop){o.rotation.set(rr(-.25,.25),rr(0,Math.PI*2),rr(-.25,.25));}else o.rotation.set(rr(0,Math.PI*2),rr(0,Math.PI*2),rr(0,Math.PI*2));
    const s=size*rr(.75,1.25);o.scale.set(s,s*(droop?1.3:1),s);o.updateMatrix();mesh.setMatrixAt(i,o.matrix);
    const lit=light[0]+(light[1]-light[0])*Math.min(1,Math.max(0,(dy+1)/2*.7+d*.4));col.setHSL(0,0,lit);col.offsetHSL(rr(hue[0],hue[1]),0,0);mesh.setColorAt(i,col);}
  mesh.castShadow=shadow;mesh.customDepthMaterial=depthFor(map);scene.add(mesh);return mesh;}
// tapered limb between two points
const UP=new THREE.Vector3(0,1,0);
function limb(a,b,r0,r1,mat,seg=8){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),len=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,len,seg,1),mat);m.position.copy(A).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(UP,d.normalize());m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
function branchPath(pts,r0,r1,mat){for(let i=0;i<pts.length-1;i++){const t0=i/(pts.length-1),t1=(i+1)/(pts.length-1);limb(pts[i],pts[i+1],r0+(r1-r0)*t0,r0+(r1-r0)*t1,mat);}}

// ---- banyan (榕樹): fused trunks, wide flat dome, curtains of aerial roots ----
function banyanTree(x,z){
  for(let i=0;i<7;i++){const a=i/7*Math.PI*2+rr(-.2,.2),r=rr(.5,.95);branchPath([[x+Math.cos(a)*r*1.5,0,z+Math.sin(a)*r*1.5],[x+Math.cos(a)*r*.7,1.2,z+Math.sin(a)*r*.7],[x+Math.cos(a)*r*.45,2.6,z+Math.sin(a)*r*.45],[x+Math.cos(a)*.35,3.6,z+Math.sin(a)*.35]],.5,.32,BARK.banyan);}
  for(let i=0;i<9;i++){const a=i/9*Math.PI*2+rr(-.25,.25),r1=rr(3,4.5),r2=rr(6,8.5),y1=rr(5,6.2);
    branchPath([[x,3.4,z],[x+Math.cos(a)*r1,y1,z+Math.sin(a)*r1],[x+Math.cos(a+rr(-.3,.3))*r2,y1+rr(1,2),z+Math.sin(a+rr(-.3,.3))*r2]],.36,.08,BARK.banyan);}
  canopy({x,y:8.4,z,rx:10,ry:3.4,rz:9,n:1800,size:2.3,map:leafBroad,hue:[-.02,.02],light:[.45,.9],shell:.35});
  canopy({x:x+rr(-2,2),y:10.2,z:z+rr(-2,2),rx:6,ry:2.2,rz:6,n:600,size:2.2,map:leafBroad,light:[.7,1.0],shell:.4});
  // aerial roots
  const N=260,geo=new THREE.CylinderGeometry(.012,.022,1,4,1);geo.translate(0,-.5,0);const roots=new THREE.InstancedMesh(geo,BARK.root,N);const o=new THREE.Object3D();
  for(let i=0;i<N;i++){const a=rnd()*Math.PI*2,d=Math.sqrt(rnd())*8.5+1,top=6.8-d*.12+rr(-.4,.4),len=rnd()<.06?top:rr(.6,2.8)*rr(.5,1.2);
    o.position.set(x+Math.cos(a)*d,top,z+Math.sin(a)*d*.9);o.rotation.set(rr(-.04,.04),0,rr(-.04,.04));o.scale.set(rnd()<.1?2.4:1,len,rnd()<.1?2.4:1);o.updateMatrix();roots.setMatrixAt(i,o.matrix);}
  roots.castShadow=true;scene.add(roots);
  // flared surface roots at the base
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2+rr(-.2,.2),r=rr(2,3);limb([x+Math.cos(a)*.6,.5,z+Math.sin(a)*.6],[x+Math.cos(a)*r,.02,z+Math.sin(a)*r],.3,.06,BARK.banyan);}}

// ---- casuarina (木麻黃): tall thin trunk, airy drooping needle crown ----
function casuTree(x,z,h=12){const lean=[rr(-.6,.6),rr(-.6,.6)];
  const top=[x+lean[0],h*.72,z+lean[1]];branchPath([[x,0,z],[x+lean[0]*.4,h*.35,z+lean[1]*.4],top],.26,.1,BARK.casu);
  const crowns=3+Math.floor(rnd()*3);
  for(let i=0;i<crowns;i++){const a=rnd()*Math.PI*2,d=rr(.5,2),cy=rr(h*.6,h*.95);
    limb(top,[top[0]+Math.cos(a)*d,cy,top[2]+Math.sin(a)*d],.09,.03,BARK.casu,5);
    canopy({x:top[0]+Math.cos(a)*d,y:cy,z:top[2]+Math.sin(a)*d,rx:rr(1.6,2.6),ry:rr(1.4,2.2),rz:rr(1.6,2.6),n:75,size:2.1,map:leafNeedle,hue:[-.01,.02],light:[.6,.95],shell:.6,droop:1});}}

// ---- dense round broadleaf tree (left of the lawn) ----
function roundTree(x,z,s=1){for(let i=0;i<4;i++){const a=i*1.6+rr(-.3,.3);branchPath([[x,0,z],[x+Math.cos(a)*.6*s,2*s,z+Math.sin(a)*.6*s],[x+Math.cos(a)*3*s,4.2*s,z+Math.sin(a)*3*s]],.32*s,.1,BARK.banyan);}
  canopy({x,y:5.6*s,z,rx:6*s,ry:3.4*s,rz:5.6*s,n:Math.round(1000*s),size:2.2*s,map:leafBroad,hue:[.0,.03],light:[.45,.9],shell:.35});}

// ---- royal palm (大王椰子) ----
function featherFrond(len,width,map){const seg=10,P=[],U=[],I=[];
  for(let i=0;i<=seg;i++){const t=i/seg,x=t*len,y=Math.sin(t*1.25)*len*.45-t*t*len*.55;for(const s of [-1,1]){P.push(x,y,s*width/2*(1-t*.5));U.push(t,s<0?0:1);}if(i<seg){const k=i*2;I.push(k,k+2,k+1,k+1,k+2,k+3);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.setIndex(I);g.computeVertexNormals();return g;}
const palmMat=new THREE.MeshStandardMaterial({map:palmFrondTex,alphaTest:.45,side:THREE.DoubleSide,roughness:.8}),palmDepth=depthFor(palmFrondTex);
function royalPalm(x,z,h=14){const t=new THREE.Mesh(new THREE.CylinderGeometry(.3,.38,h,14,6),BARK.palm);const p=t.geometry.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i)/h+.5,k=1+Math.sin(y*Math.PI)*.18;p.setX(i,p.getX(i)*k);p.setZ(i,p.getZ(i)*k);}t.geometry.computeVertexNormals();t.position.set(x,h/2,z);t.castShadow=true;scene.add(t);
  const cs=new THREE.Mesh(new THREE.CylinderGeometry(.3,.34,2.4,12),new THREE.MeshStandardMaterial({color:0x6f8a3c,roughness:.7}));cs.position.set(x,h+1.2,z);cs.castShadow=true;scene.add(cs);
  for(let i=0;i<16;i++){const g=featherFrond(rr(3.6,4.6),1.6,palmFrondTex);const f=new THREE.Mesh(g,palmMat);f.customDepthMaterial=palmDepth;f.position.set(x,h+2.3,z);f.rotation.set(rr(-.15,.15),i/16*Math.PI*2+rr(-.1,.1),rr(-.35,.5),'YXZ');f.castShadow=true;scene.add(f);}}

// ---- Norfolk Island pine (南洋杉): tiered horizontal whorls ----
// Norfolk Island pine (南洋杉): straight trunk, tiers of horizontal limbs with upturned tips,
// each limb clothed in dense rope-like needle branchlets
const leafArau=alphaTex(256,256,(g,W,H)=>{for(let r=0;r<6;r++){const x0=rr(10,50),y0=rr(40,216),ang=rr(-.3,.3),len=rr(160,230);
  for(let i=0;i<=26;i++){const t=i/26,px=x0+Math.cos(ang)*len*t,py=y0+Math.sin(ang)*len*t+Math.sin(t*3+r)*5+t*t*14;
    for(let k=0;k<16;k++){const a=rnd()*Math.PI*2,l=rr(5,12)*(1-t*.4);g.strokeStyle=`hsl(${rr(98,128)},${rr(28,48)}%,${rr(14,32)}%)`;g.lineWidth=rr(1,2.2);g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l*.8);g.stroke();}}}});
function araucaria(x,z,h=16){limb([x,0,z],[x,h,z],.36,.04,BARK.casu,10);
  const cards=[];let y=1.9,phase=rr(0,6);
  while(y<h-.5){const k=(h-y)/h,L=Math.max(.35,3.6*Math.pow(k,1.05)),n=y<h-2.5?6:5;phase+=.55;
    for(let i=0;i<n;i++){const a=phase+i/n*Math.PI*2+rr(-.15,.15),dx=Math.cos(a),dz=Math.sin(a);
      const mid=[x+dx*L*.55,y-L*.07,z+dz*L*.55],tip=[x+dx*L,y+L*.1,z+dz*L];
      limb([x,y,z],mid,.03+.06*k,.03,BARK.casu,5);limb(mid,tip,.03,.01,BARK.casu,4);
      const steps=Math.max(2,Math.round(L/.3));
      for(let s=0;s<=steps;s++){const t=.12+.88*s/steps,py=y-L*.07*Math.sin(Math.min(1,t/.55)*Math.PI/2)*(t<.55?1:1-(t-.55)/.45)+(t>.55?(t-.55)/.45*L*.17:0);
        for(let c=0;c<3;c++)cards.push({p:[x+dx*L*t+rr(-.18,.18),py+rr(-.14,.16),z+dz*L*t+rr(-.18,.18)],a,t,k,flat:c<2});}}
    y+=rr(.78,.98);}
  for(let i=0;i<10;i++)cards.push({p:[x+rr(-.25,.25),h-rr(0,.9),z+rr(-.25,.25)],a:rnd()*6.3,t:1,k:0,flat:false});
  const mesh=new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),foliageMat(leafArau,new THREE.Vector3(x,h*.4,z)),cards.length);
  const o=new THREE.Object3D(),col=new THREE.Color();
  cards.forEach((c,i)=>{o.position.set(...c.p);o.rotation.set(c.flat?-Math.PI/2+rr(-.45,.45):rr(-.35,.35),-c.a+rr(-.5,.5),rr(-.25,.25),'YXZ');
    const s=rr(.75,1.1)*(.7+.5*c.k);o.scale.set(s*1.35,s,s);o.updateMatrix();mesh.setMatrixAt(i,o.matrix);
    col.setHSL(0,0,.5+.45*c.t*(1-c.k*.3)+rr(-.06,.06));mesh.setColorAt(i,col);});
  mesh.castShadow=true;mesh.customDepthMaterial=depthFor(leafArau);scene.add(mesh);}

const _c1=new THREE.Color(),_c2=new THREE.Color();
function lerpHex(a,b,t){return _c1.set(a).lerp(_c2.set(b),t).getStyle();}
const lampMat=new THREE.MeshStandardMaterial({color:0xf0e6d0,emissive:0xffcf8a,emissiveIntensity:0});

function setDay(d){d=Math.max(0,Math.min(1,d));let i=0;while(i<SKYK.length-2&&d>SKYK[i+1][0])i++;const A=SKYK[i],B=SKYK[i+1],t=(d-A[0])/(B[0]-A[0]);
  const g=skyCan.getContext('2d'),gr=g.createLinearGradient(0,0,0,skyCan.height);const top=lerpHex(A[1],B[1],t),mid=lerpHex(A[2],B[2],t),bot=lerpHex(A[3],B[3],t);
  gr.addColorStop(0,top);gr.addColorStop(.55,mid);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,skyCan.width,skyCan.height);scene.background.needsUpdate=true;
  scene.fog.color.set(bot);sun.color.set(lerpHex(A[4],B[4],t));sun.intensity=A[5]+(B[5]-A[5])*t;hemi.intensity=A[6]+(B[6]-A[6])*t;hemi.color.set(lerpHex('#dbe9ff',top,.35));
  const ph=0.12+d*2.9;sun.position.set(-48*Math.cos(ph),6+52*Math.sin(ph),26);
  const night=Math.max(0,Math.min(1,(d-.8)/.2));glowMats.forEach(m=>m.emissiveIntensity=night*1.1);lampMat.emissiveIntensity=night*2.2;
  renderer.toneMappingExposure=1.05+night*.2;dirty=3;}

const POEM=[
 '校園一隅日式建築，隱藏在老榕的樹叢中，每每至此，徘徊不甘離去，對稱的中軸線延伸兩臂不差毫釐，排列整齊的屋瓦，讓視覺渲染3D化，彷若往天空堆疊無限。',
 '環繞的老榕木麻黃，讓這個理性幾合線條柔軟沉浸綠化，周遭鳥雀的落玉盤聲，又讓聽覺剔透了起來，隨著清晨到黃昏遞移的不只是光，還有從爭鳴到笙簫默的無聲之聲，隱約可聽到自己的心跳聲。',
 '踱步於前，檜木的淡芳，將我拉回到兒時記憶的日式員寮，阿公所住的糖廠宿舍，就是這記憶中的香，嗅覺瞬間連結兩個時空記憶，緩慢且沈浸。',
 '望著惹鐵鏽的門把，檜木與窗花的玻璃，手動交錯的下層風口，還有門前這一片棧板，仰望著祂，這一座立體的美學，空間的詩，歷史的圖畫，靜默，又何所求。'];
const NUMS=['一','二','三','四'];
// chapters (seconds)
const TCH=[{s:0,e:6},{s:6,e:44},{s:44,e:86},{s:86,e:124},{s:124,e:164},{s:164,e:178}];const TOTAL=178;
const chAt=tt=>{for(let i=TCH.length-1;i>=0;i--)if(tt>=TCH[i].s)return i;return 0;};
// camera keyframes [time, pos, target]
const KEYS=[[0,[0,1.7,46],[0,3,0]],[6,[0,1.8,40],[0,3,2]],[20,[0,2.4,27],[0,3.2,2]],[32,[-4,7.5,24],[0,5.5,0]],[44,[-9,9,19],[0,5,0]],
 [56,[22,2.2,34],[10,5,17]],[68,[15,1.8,24],[6,7,17]],[80,[6,1.7,27],[0,3,6]],[86,[5,1.8,25],[-2,3,5]],
 [94,[-21,2.1,4.9],[-10,2,4.9]],[102,[-15,2.1,4.9],[10,1.9,4.9]],[124,[-4.5,2.1,5],[14,1.9,4.6]],
 [132,[-2.1,2.0,6.2],[-2.1,1.7,3.4]],[142,[-2.1,1.3,10],[-2.1,3.4,4]],[154,[0,0.9,16],[0,4.4,2]],[164,[0,2.2,34],[0,3.4,2]],[178,[0,2.6,44],[0,3.4,2]]];
const DAYK=[[0,.12],[6,.14],[44,.3],[86,.82],[124,.88],[164,.97],[178,1]];
const sm=t=>t*t*(3-2*t);
function keyAt(tt){let i=0;while(i<KEYS.length-2&&tt>KEYS[i+1][0])i++;const a=KEYS[i],b=KEYS[i+1],t=sm(Math.max(0,Math.min(1,(tt-a[0])/(b[0]-a[0]))));
  return{p:new THREE.Vector3(...a[1]).lerp(new THREE.Vector3(...b[1]),t),t:new THREE.Vector3(...a[2]).lerp(new THREE.Vector3(...b[2]),t)};}
function dayAt(tt){let i=0;while(i<DAYK.length-2&&tt>DAYK[i+1][0])i++;const a=DAYK[i],b=DAYK[i+1];return a[1]+(b[1]-a[1])*Math.max(0,Math.min(1,(tt-a[0])/(b[0]-a[0])));}

// ================= music (original, synthesized live) =================
let AC=null,master,reverbIn,delayIn,windGain,bus=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function impulse(sec){const r=AC.sampleRate,n=r*sec|0,b=AC.createBuffer(2,n,r);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);}return b;}
function initAudio(){AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=0;master.connect(comp);
  const conv=AC.createConvolver();conv.buffer=impulse(5);reverbIn=AC.createGain();reverbIn.gain.value=.5;reverbIn.connect(conv);conv.connect(master);
  delayIn=AC.createGain();const dl=AC.createDelay(2);dl.delayTime.value=BEAT*.75;const fb=AC.createGain();fb.gain.value=.33;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  delayIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);const dOut=AC.createGain();dOut.gain.value=.4;lp.connect(dOut);dOut.connect(master);lp.connect(reverbIn);
  // leaves & wind: filtered noise
  const nb=AC.createBuffer(1,AC.sampleRate*4,AC.sampleRate),nd=nb.getChannelData(0);let last=0;for(let i=0;i<nd.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;nd[i]=last*3.5;}
  const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=.6;windGain=AC.createGain();windGain.gain.value=0;ns.connect(bp);bp.connect(windGain);windGain.connect(master);ns.start();}
function newBus(){if(bus){const old=bus;old.g.gain.setTargetAtTime(0,AC.currentTime,.25);setTimeout(()=>old.g.disconnect(),1500);}
  const g=AC.createGain();g.connect(master);const dry=AC.createGain();dry.gain.value=.8;dry.connect(g);const rev=AC.createGain();rev.connect(g);rev.connect(reverbIn);rev.gain.value=0;
  const r2=AC.createGain();r2.gain.value=.55;g.connect(r2);r2.connect(reverbIn);const d2=AC.createGain();d2.gain.value=1;d2.connect(delayIn);bus={g,dry,dly:d2};}
// soft plucked string — somewhere between a koto and a kalimba
function pluck(t,m,vel,pan,echo,box){const f=mtof(m),p=AC.createStereoPanner();p.pan.value=pan;const g=AC.createGain(),dec=box?2.2:3.4;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=f;o1.connect(g);
  const o2=AC.createOscillator();o2.type=box?'sine':'triangle';o2.frequency.value=f*(box?4.0:2.0);const g2=AC.createGain();g2.gain.setValueAtTime(box?.12:.35,t);g2.gain.exponentialRampToValueAtTime(.001,t+(box?.4:.7));o2.connect(g2);g2.connect(g);
  g.connect(p);p.connect(bus.g);if(echo)p.connect(bus.dly);for(const o of [o1,o2]){o.start(t);o.stop(t+dec+.1);}}
function pad(t,notes,dur,vel){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=950;lp.Q.value=.4;const g=AC.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+Math.min(3.5,dur*.4));g.gain.setValueAtTime(vel,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+3);
  lp.connect(g);g.connect(bus.g);notes.forEach(m=>[-6,6].forEach(dt=>{const o=AC.createOscillator();o.type='triangle';o.frequency.value=mtof(m);o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+dur+3.2);}));}
function bass(t,m,vel){const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+5);
  const o=AC.createOscillator();o.type='sine';o.frequency.value=mtof(m);o.connect(g);const o2=AC.createOscillator();o2.type='triangle';o2.frequency.value=mtof(m+12);const g2=AC.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(g);
  g.connect(bus.g);o.start(t);o2.start(t);o.stop(t+5.1);o2.stop(t+5.1);}
function bird(t,pan){const p=AC.createStereoPanner();p.pan.value=pan;p.connect(bus.g);const kind=rnd()<.7,n=kind?2+Math.floor(rnd()*4):2,f0=rr(2400,4300);
  for(let i=0;i<n;i++){const s=t+i*(kind?rr(.07,.13):rr(.3,.45)),o=AC.createOscillator(),g=AC.createGain();o.type='sine';
    if(kind){o.frequency.setValueAtTime(f0,s);o.frequency.exponentialRampToValueAtTime(f0*rr(1.25,1.6),s+.04);o.frequency.exponentialRampToValueAtTime(f0*.85,s+.085);}
    else{const b=rr(1700,2300);o.frequency.setValueAtTime(b,s);o.frequency.exponentialRampToValueAtTime(b*(i?1.12:1.4),s+.22);}
    const len=kind?.09:.28;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(kind?.028:.02,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+len);o.connect(g);g.connect(p);o.start(s);o.stop(s+len+.02);}}
function heart(t,vel){for(const [dt,v] of [[0,1],[.27,.65]]){const s=t+dt,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(64,s);o.frequency.exponentialRampToValueAtTime(38,s+.16);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vel*v,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+.28);o.connect(g);g.connect(master);o.start(s);o.stop(s+.3);}}

const BEAT=0.9;
// chord tables: [bass, pad voicing] — 陽音階 D E G A B colour, borrowed chords for the memory chapter
const PROG={A:[[43,[55,59,62,69]],[40,[52,55,59,62]],[38,[50,57,62,64]],[45,[52,57,59,64]]],
 C:[[43,[55,59,62,69]],[47,[50,54,57,59]],[40,[52,55,59,62]],[45,[52,57,59,64]]],
 B:[[40,[52,55,59,62]],[36,[48,52,55,59]],[43,[55,59,62,67]],[42,[50,57,62,64]]]};
const SCALE=[62,64,67,69,71,74,76,79,81,83,86,88];
const THEME=[[74,0],[76,1],[79,2],[76,3],[74,4],[71,5.5],[69,6.5],[74,8]]; // the 老靈魂 motif
const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
function params(tt){const c=chAt(tt),f=(tt-TCH[c].s)/(TCH[c].e-TCH[c].s);
  switch(c){case 0:return{c,f,den:0,birds:.3,heart:0,wind:.02,prog:'A'};
    case 1:return{c,f,den:.3,birds:.6,heart:0,wind:.025,prog:'A'};
    case 2:return{c,f,den:lerp(.32,.06,f),birds:lerp(3.2,0,f/.7),heart:f>.72?(f-.72)/.28*.55:0,wind:lerp(.035,.012,f),prog:'C'};
    case 3:return{c,f,den:.38,birds:0,heart:.5*(1-f),wind:.012,prog:'B',box:1};
    case 4:return{c,f,den:lerp(.3,.04,f),birds:f<.5?.12:0,heart:f>.82?.42:0,wind:.015,prog:'A'};
    default:return{c,f,den:0,birds:0,heart:tt<171?.3:0,wind:lerp(.015,0,f),prog:'A'};}}
let tourStart=0,nextBeat=0,melIdx=5,themeDone={},themeUntil=0,outroPad=false,lastTick=0,schedTimer=null;
function schedule(){if(!AC||AC.state!=='running')return;const now=AC.currentTime,dt=Math.min(.2,now-lastTick);lastTick=now;
  const P=params(now-tourStart);windGain.gain.setTargetAtTime(P.wind,now,1.5);
  if(rnd()<P.birds*dt)bird(now+rr(.05,.25),rr(-.85,.85));
  while(nextBeat<now+.35){const t=nextBeat,tt=t-tourStart,bn=Math.round(tt/BEAT),Q=params(tt);
    if(tt>=0&&tt<TOTAL){
      if(Q.c===5){if(!outroPad){outroPad=true;const ch=PROG.A[0];pad(t,ch[1],9,.022);bass(t,ch[0],.16);master.gain.setTargetAtTime(0,tourStart+170,2.4);}}
      else if(bn%8===0){const ch=PROG[Q.prog][Math.floor(bn/8)%4];pad(t,ch[1],8*BEAT,.02);bass(t,ch[0],.15);}
      if((Q.c===1||Q.c===4)&&!themeDone[Q.c]&&tt>=TCH[Q.c].s+3.5){themeDone[Q.c]=1;THEME.forEach(([m,b])=>pluck(t+b*BEAT,m,.26,rr(-.15,.15),1));themeUntil=tt+10*BEAT;}
      else if(tt>themeUntil&&rnd()<Q.den){const st=[-2,-1,-1,1,1,2][Math.floor(rnd()*6)],lo=Q.box?5:1,hi=Q.box?11:8;melIdx=Math.max(lo,Math.min(hi,melIdx+st));
        pluck(t,SCALE[melIdx],Q.box?.13:rr(.13,.22),rr(-.5,.5),rnd()<.4,Q.box);
        if(rnd()<.22){const j=Math.max(lo,Math.min(hi,melIdx+(rnd()<.5?-1:1)));pluck(t+BEAT/2,SCALE[j],.1,rr(-.5,.5),0,Q.box);}}
      if(Q.heart>0)heart(t,Q.heart);}
    nextBeat+=BEAT;}}

// ================= tour control =================
let touring=false,ended=false,curCh=-1;const tourEl=document.getElementById('tour'),tTitle=document.getElementById('tTitle'),tText=document.getElementById('tText'),tEnd=document.getElementById('tEnd'),tProg=document.getElementById('tProg'),tPause=document.getElementById('tPause');
const chBtns=[...document.querySelectorAll('[data-ch]')];
function renderText(c){if(c>=1&&c<=4){tText.innerHTML='<b class="no">'+NUMS[c-1]+'</b>'+POEM[c-1].match(/[^，。]+[，。]?/g).map(s=>'<span>'+s+'</span>').join('');}else tText.innerHTML='';}
function seek(tt){tourStart=AC.currentTime-tt;nextBeat=tourStart+Math.ceil((tt+.05)/BEAT)*BEAT;themeDone={};for(let i=1;i<5;i++)if(TCH[i].s+3.5<tt)themeDone[i]=1;themeUntil=0;outroPad=tt>=TCH[5].s;curCh=-1;ended=false;tEnd.hidden=true;
  newBus();master.gain.cancelScheduledValues(AC.currentTime);master.gain.setTargetAtTime(.9,AC.currentTime,.8);}
async function startTour(){if(!AC)initAudio();await AC.resume().catch(()=>{});lastTick=AC.currentTime;
  touring=true;document.body.classList.add('touring');tourEl.hidden=false;controls.enabled=false;controls.autoRotate=false;spin.setAttribute('aria-pressed','false');tween=null;
  tPause.textContent='暫停';seek(0);if(!schedTimer)schedTimer=setInterval(schedule,50);}
function exitTour(){touring=false;if(AC){master.gain.cancelScheduledValues(AC.currentTime);master.gain.setTargetAtTime(0,AC.currentTime,.4);setTimeout(()=>{if(!touring)AC.suspend();},1600);}
  tourEl.hidden=true;document.body.classList.remove('touring');controls.enabled=true;setDay(.35);go('front');}
document.getElementById('v-soul').addEventListener('click',startTour);
document.getElementById('tExit').addEventListener('click',exitTour);
document.getElementById('tFree').addEventListener('click',exitTour);
document.getElementById('tAgain').addEventListener('click',()=>{AC.resume();tPause.textContent='暫停';seek(0);});
tPause.addEventListener('click',()=>{if(AC.state==='running'){AC.suspend();tPause.textContent='繼續';}else{AC.resume();tPause.textContent='暫停';}});
chBtns.forEach(b=>b.addEventListener('click',()=>{AC.resume();tPause.textContent='暫停';seek(TCH[+b.dataset.ch].s+.01);}));
function updateTour(){const tt=Math.max(0,AC.currentTime-tourStart);const k=keyAt(Math.min(tt,TOTAL));camera.position.copy(k.p);controls.target.copy(k.t);camera.lookAt(k.t);setDay(dayAt(Math.min(tt,TOTAL)));
  const c=chAt(tt);if(c!==curCh){curCh=c;renderText(c);chBtns.forEach(b=>b.setAttribute('aria-current',+b.dataset.ch===c));}
  tTitle.style.opacity=tt<5?1:0;tProg.style.width=Math.min(100,tt/TOTAL*100)+'%';
  if(c>=1&&c<=4){const sp=tText.querySelectorAll('span'),dur=TCH[c].e-TCH[c].s;let n=0;sp.forEach((s,i)=>{if(tt-TCH[c].s>1.2+i*(dur*.86/sp.length))n=i+1;});sp.forEach((s,i)=>{s.classList.toggle('cur',i===n-1);s.classList.toggle('prev',i===n-2);});tText.style.opacity=(TCH[c].e-tt<1.4)?0:1;}
  if(tt>=TOTAL-2&&!ended){ended=true;tEnd.hidden=false;}}

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<600?58:45;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
go('front',true);setDay(.35);

dirty=3;addEventListener('resize',()=>dirty=3);controls.addEventListener('change',()=>dirty=2);document.fonts&&document.fonts.ready.then(()=>dirty=3);setTimeout(()=>dirty=3,1500);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(now){requestAnimationFrame(loop);
  if(tween){const k=Math.min(1,(now-tween.start)/tween.dur),e=ease(k);camera.position.lerpVectors(tween.from.p,tween.to.p,e);controls.target.lerpVectors(tween.from.t,tween.to.t,e);if(k>=1)tween=null;}
  if(touring&&AC)updateTour();
  const moved=controls.enabled?controls.update():false;if(touring||moved||tween||dirty>0){renderer.render(scene,camera);dirty=Math.max(0,dirty-1);}}
requestAnimationFrame(loop);
</script>
